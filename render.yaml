services:
  - type: web
    name: braillearn-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CELL_BASE_POINT
        value: 24